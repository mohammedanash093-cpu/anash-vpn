name: Build Anash VPN APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q anash-vpn.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build debug APK
        working-directory: anash-vpn
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace > ../build.log 2>&1 || {
            msg=$(grep -iE "error|wrong|failed|exception|not found|could not" ../build.log | head -n 12 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error::BUILD FAILED: $msg"
            exit 1
          }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AnashVPN-debug-apk
          path: anash-vpn/app/build/outputs/apk/debug/*.apk
